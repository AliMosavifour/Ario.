name: Update APK version info
# Runs whenever a new ario.apk is pushed. Rewrites version.json so the site
# shows the right version, size and date without any manual edit.
on:
  push:
    branches: [main]
    paths: ["ario.apk", "index.html"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_version.py
      - run: python3 scripts/set_site_url.py
      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json changelog.json index.html
          git diff --cached --quiet || git commit -m "Update version and site URL" && git push
