<style>
@font-face{font-family:'Vazirmatn';src:url(app/fonts/Vazirmatn.woff2) format('woff2');font-weight:100 900;font-display:swap}
/* Layout: one centered column; glass cards float over soft violet/blue light; phones are the hero, everything else stays quiet. */
:root{
  --bg:#eceefb; --bg2:#e2e4f8; --ink:#13152d; --muted:#585c82;
  --accent:#5a5cf0; --accent2:#8b5cf6; --on-accent:#fff;
  --glass:rgba(255,255,255,.62); --glass-line:rgba(255,255,255,.85); --line:rgba(80,84,200,.16);
  --orb1:rgba(110,120,255,.45); --orb2:rgba(170,110,255,.38); --shadow:0 20px 50px -20px rgba(60,60,170,.35);
  --font-display:'Outfit','Vazirmatn',system-ui,sans-serif; --font-body:'Vazirmatn','Outfit',system-ui,sans-serif;
  --show-l:block; --show-d:none; color-scheme:light;
  --k-date:#2f6df6; --k-time:#7c4dff; --k-tag:#14a56b; --k-prio:#e8590c; --k-rep:#d6336c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#090a18; --bg2:#0e1028; --ink:#eef0ff; --muted:#a2a6d0;
  --accent:#7d86ff; --accent2:#a77dff; --on-accent:#0b0c20;
  --glass:rgba(28,30,64,.55); --glass-line:rgba(140,150,255,.22); --line:rgba(140,150,255,.18);
  --orb1:rgba(80,90,255,.35); --orb2:rgba(150,80,255,.3); --shadow:0 24px 60px -24px rgba(0,0,0,.8);
  --show-l:none; --show-d:block; color-scheme:dark;
  --k-date:#7ea6ff; --k-time:#b39bff; --k-tag:#52d6a0; --k-prio:#ffa062; --k-rep:#ff8fb8;}}
:root[data-theme="dark"]{
  --bg:#090a18; --bg2:#0e1028; --ink:#eef0ff; --muted:#a2a6d0;
  --accent:#7d86ff; --accent2:#a77dff; --on-accent:#0b0c20;
  --glass:rgba(28,30,64,.55); --glass-line:rgba(140,150,255,.22); --line:rgba(140,150,255,.18);
  --orb1:rgba(80,90,255,.35); --orb2:rgba(150,80,255,.3); --shadow:0 24px 60px -24px rgba(0,0,0,.8);
  --show-l:none; --show-d:block; color-scheme:dark;
  --k-date:#7ea6ff; --k-time:#b39bff; --k-tag:#52d6a0; --k-prio:#ffa062; --k-rep:#ff8fb8;}

*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.75 var(--font-body);
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;will-change:auto}
.orbs i:nth-child(1){width:46vw;height:46vw;min-width:320px;min-height:320px;background:radial-gradient(closest-side,var(--orb1),transparent);top:-12vw;inset-inline-start:-10vw}
.orbs i:nth-child(2){width:40vw;height:40vw;min-width:280px;min-height:280px;background:radial-gradient(closest-side,var(--orb2),transparent);top:30vh;inset-inline-end:-12vw}
.wrap{position:relative;z-index:1;max-width:1120px;margin-inline:auto}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}
h1,h2,h3{font-family:var(--font-display);line-height:1.25;text-wrap:balance;margin:0}
[dir=rtl] h1,[dir=rtl] h2,[dir=rtl] h3{font-family:var(--font-body)}
p{margin:0}

/* nav */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;margin-top:12px;display:flex;align-items:center;gap:12px;
  padding:8px 10px 8px 14px;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);
  backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;font:700 20px var(--font-display);text-decoration:none;margin-inline-end:auto}
.brand img{width:34px;height:34px;border-radius:10px}
.links{display:flex;gap:4px}
.links a{text-decoration:none;font-size:14px;color:var(--muted);padding:6px 12px;border-radius:12px}
.links a:hover{color:var(--ink);background:var(--line)}
.ctl{display:flex;gap:6px;align-items:center}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px}
.seg button,.ico{font:600 13px var(--font-body);border:0;background:none;color:var(--muted);padding:5px 10px;border-radius:11px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 6px rgba(0,0,0,.12)}.seg button{position:relative;overflow:hidden;transition:transform .15s cubic-bezier(.2,.9,.25,1),background .25s,color .25s,box-shadow .25s;-webkit-tap-highlight-color:transparent}
.seg button:active{transform:scale(.86)}
.seg button.tap{animation:segPop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes segPop{0%{transform:scale(.86)}55%{transform:scale(1.12)}100%{transform:scale(1)}}
.seg .rp{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--accent);opacity:.35;pointer-events:none;animation:segRp .55s ease-out forwards}
@keyframes segRp{to{transform:scale(7);opacity:0}}
.ico{width:36px;height:36px;padding:0;display:grid;place-items:center;background:var(--line)}
.ico svg{width:18px;height:18px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;border-radius:18px;padding:14px 24px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);box-shadow:0 14px 30px -10px var(--accent);
  transition:transform .2s,box-shadow .2s;border:0;cursor:pointer;font-family:var(--font-body);font-size:16px}
.btn:hover{transform:translateY(-2px);box-shadow:0 18px 36px -10px var(--accent)}
.btn svg{width:22px;height:22px}
.btn.sm{padding:8px 16px;font-size:14px;border-radius:14px}
.btn.ghost{background:var(--glass);color:var(--ink);border:1px solid var(--glass-line);box-shadow:none}
.glass{background:var(--glass);border:1px solid var(--glass-line);border-radius:28px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:var(--shadow)}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:32px;align-items:center;padding-block:56px 40px}
.hero>*{min-width:0}
.pill{display:inline-flex;gap:8px;align-items:center;padding:6px 14px;border-radius:99px;background:var(--glass);border:1px solid var(--glass-line);font-size:13px;color:var(--muted)}
.pill b{width:8px;height:8px;border-radius:50%;background:#35c98a;box-shadow:0 0 0 4px rgba(53,201,138,.2)}
h1{font-size:clamp(34px,5.4vw,62px);font-weight:700;margin-block:18px 16px;letter-spacing:-.01em}
[dir=rtl] h1{font-weight:800;line-height:1.35;letter-spacing:0}
h1 em{font-style:normal;background:linear-gradient(120deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:18px;color:var(--muted);max-width:52ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.meta{font-size:13px;color:var(--muted);margin-top:14px;font-variant-numeric:tabular-nums}
.stage{position:relative;height:min(640px,120vw);display:grid;place-items:center}
.phone{position:absolute;width:min(46%,250px);aspect-ratio:520/1126;border-radius:34px;padding:7px;background:linear-gradient(160deg,#4b4f86,#14162e);
  box-shadow:0 40px 60px -26px rgba(20,20,80,.6),inset 0 0 0 1.5px rgba(255,255,255,.18)}
.phone img{width:100%;height:100%;border-radius:28px;display:block;object-fit:cover}
.shot.l{display:var(--show-l)}.shot.d{display:var(--show-d)}
.stage{perspective:1000px}
.p1{inset-inline-start:6%;top:7%;transform:translateY(calc(var(--sy,0)*-54px)) rotate(calc(-5deg - var(--sy,0)*9deg)) rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--sp,0deg)));transition:transform .25s ease-out;animation:fl 7s ease-in-out infinite}
.p2{inset-inline-end:4%;bottom:2%;transform:translateY(calc(var(--sy,0)*40px)) rotate(calc(5deg + var(--sy,0)*9deg)) rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--sp,0deg)));transition:transform .25s ease-out;animation:fl 8s ease-in-out -3s infinite}
[dir=rtl] .p1{transform:translateY(calc(var(--sy,0)*-54px)) rotate(calc(5deg + var(--sy,0)*9deg)) rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--sp,0deg)))}[dir=rtl] .p2{transform:translateY(calc(var(--sy,0)*40px)) rotate(calc(-5deg - var(--sy,0)*9deg)) rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--sp,0deg)))}
@keyframes fl{50%{translate:0 -12px}}
.ghost-icon{position:absolute;width:84px;height:84px;border-radius:24px;inset-inline-end:44%;top:0;z-index:3;box-shadow:0 18px 40px -8px var(--accent);transform:translateY(calc(var(--sy,0)*-80px)) rotate(calc(var(--sy,0)*28deg));will-change:transform}
.phone img{transition:opacity .22s ease,transform .22s ease}
.phone.swp img{opacity:0;transform:scale(.97)}
.phone{will-change:transform}

/* sections */
section{padding-block:56px}
.head{max-width:60ch;margin-bottom:32px}
.head h2{font-size:clamp(26px,3.6vw,40px);font-weight:700}
[dir=rtl] .head h2{font-weight:800}
.head p{color:var(--muted);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{padding:26px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));margin-bottom:6px}
.card .ic svg{width:24px;height:24px}
.card h3{font-size:19px;font-weight:700}
.card p{font-size:15px;color:var(--muted)}
.card.wide{grid-column:span 2}
.card.full{grid-column:1/-1}
.sample{margin-top:6px;padding:10px 14px;border-radius:14px;background:var(--line);font-size:14px;color:var(--ink)}

.gal{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 4px 24px;margin-inline:-4px;scrollbar-width:thin}
.gal figure{margin:0;flex:0 0 min(240px,62vw);scroll-snap-align:center;text-align:center}
.gal .phone{position:relative;width:100%;animation:none;transform:none;inset:auto}
.gal figcaption{margin-top:14px;font-weight:600;font-size:15px}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{padding:26px;position:relative;counter-increment:s;min-width:0}
.step::before{content:counter(s);font:700 15px var(--font-display);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);margin-bottom:14px}
.step h3{font-size:18px;margin-bottom:6px}
.step p{font-size:15px;color:var(--muted)}
.perms{margin-top:28px;padding:8px 26px}
.perm{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:16px;padding:16px 0;border-top:1px solid var(--line);font-size:15px}
.perm:first-child{border-top:0}
.perm b{font-weight:700}.perm span{color:var(--muted)}

details{padding:4px 24px;margin-bottom:12px}
summary{cursor:pointer;font-weight:700;padding:16px 0;list-style:none;display:flex;justify-content:space-between;gap:16px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:500 24px/1 var(--font-display);color:var(--accent);transition:transform .2s}
details[open] summary::after{transform:rotate(45deg)}
details p{color:var(--muted);padding-bottom:18px;font-size:15px}

.final{text-align:center;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:14px}
.final img{width:88px;height:88px;border-radius:26px;box-shadow:0 18px 40px -10px var(--accent)}
.final h2{font-size:clamp(26px,3.6vw,38px)}
.final p{color:var(--muted);max-width:46ch}

.qrbox{display:flex;gap:18px;align-items:center;margin-top:24px;padding:16px 18px;max-width:440px}
.qrbox[hidden]{display:none}
.qrbox canvas{width:132px;height:132px;border-radius:14px;background:#fff;padding:8px;flex:none;image-rendering:pixelated}
.qrbox b{display:block;font-size:16px;margin-bottom:4px}.qrbox span{font-size:14px;color:var(--muted)}
.demo{display:grid;grid-template-columns:1fr auto;gap:40px;align-items:center;padding:36px}
.demo>*{min-width:0}
.demo h2{font-size:clamp(24px,3.2vw,36px);font-weight:700;margin-bottom:10px}
[dir=rtl] .demo h2{font-weight:800}
.demo p{color:var(--muted);max-width:46ch}
.demo .note{font-size:13px;margin-top:14px}
.demo .btn{margin-top:22px}
.dphone{position:relative;width:300px;max-width:100%;aspect-ratio:390/844;border-radius:38px;padding:8px;background:linear-gradient(160deg,#4b4f86,#14162e);box-shadow:0 40px 60px -26px rgba(20,20,80,.6),inset 0 0 0 1.5px rgba(255,255,255,.18);justify-self:center}
.dscreen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--bg2)}
.dscreen>img{width:100%;height:100%;object-fit:cover;display:block}
.dscreen .shot.l{display:var(--show-l)}.dscreen .shot.d{display:var(--show-d)}
.dscreen iframe{position:absolute;inset-block-start:0;inset-inline-start:0;width:390px;height:844px;border:0;transform-origin:0 0}
[dir=rtl] .dscreen iframe{inset-inline-start:auto;left:0;right:auto}
.dplay{position:absolute;inset:0;margin:auto;width:84px;height:84px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.dplay svg{width:34px;height:34px;margin-inline-start:4px}
.dock{position:fixed;z-index:55;inset-inline:0;bottom:0;display:none;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.dock>div{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px;max-width:520px;margin-inline:auto;border-radius:22px;background:var(--glass);border:1px solid var(--glass-line);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);box-shadow:var(--shadow);transform:translateY(140%);opacity:0;filter:blur(8px);transition:transform .5s cubic-bezier(.34,1.3,.64,1),opacity .35s,filter .4s}
.dock.on>div{transform:none;opacity:1;filter:none}
.menu-open .dock>div,.menu-open .dock.on>div{transform:translateY(160%) scale(.92);opacity:0;pointer-events:none;transition:transform .25s cubic-bezier(.5,0,.75,0),opacity .2s}
.dock:not(.on)>div{transition-delay:0s}
.dock.on>div{transition-delay:0s}
html:not(.menu-open) .dock.on>div{transition-delay:.3s,.3s,.3s}
.dock img{width:40px;height:40px;border-radius:12px}
.dock b{font:700 17px var(--font-display);margin-inline-end:auto}
.dock .btn{padding:10px 20px;font-size:15px;border-radius:15px}

.typer{padding:28px;display:grid;grid-template-columns:1.1fr .9fr;gap:28px;align-items:center}
.typer>*{min-width:0}
.typer h2{font-size:clamp(24px,3.2vw,36px);font-weight:700;margin-bottom:10px}
[dir=rtl] .typer h2{font-weight:800}
.typer .lead2{color:var(--muted);max-width:46ch}
.tbox{display:flex;align-items:center;gap:10px;margin-top:22px;padding:14px 16px;border-radius:18px;background:var(--bg);border:1px solid var(--line);min-height:58px;font-size:17px;line-height:1.6}
.tbox .mic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--accent)}
.tbox .mic svg{width:18px;height:18px}
.tbox .txt{flex:1;min-width:0;overflow-wrap:anywhere}
.tbox .txt b{font-weight:600}
.tbox .k-date{color:var(--k-date)}.tbox .k-time{color:var(--k-time)}.tbox .k-tag{color:var(--k-tag)}.tbox .k-prio{color:var(--k-prio)}.tbox .k-rep{color:var(--k-rep)}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:text-bottom;margin-inline-start:1px;animation:cb 1s steps(1) infinite}
@keyframes cb{50%{opacity:0}}
.tnote{font-size:13px;color:var(--muted);margin-top:10px}
.tcard{padding:20px;border-radius:22px;background:var(--bg);border:1px solid var(--line);box-shadow:var(--shadow);min-height:168px;display:flex;flex-direction:column;gap:12px;transition:opacity .35s,transform .35s}
.tcard.off{opacity:.25;transform:scale(.97)}
.tcard .st{font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.tcard .ttl{display:flex;gap:12px;align-items:center;font-size:19px;font-weight:700}
.tcard .ring{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:99px;font-size:14px;font-weight:600;color:var(--k);background:color-mix(in srgb,var(--k) 15%,transparent);animation:pop .35s both}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--k)}
.chip.date{--k:var(--k-date)}.chip.time{--k:var(--k-time)}.chip.tag{--k:var(--k-tag)}.chip.prio{--k:var(--k-prio)}.chip.rep{--k:var(--k-rep)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.9)}}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ccard{position:relative;border:0;padding:0;cursor:pointer;aspect-ratio:3/4.3;border-radius:28px;overflow:hidden;background-size:cover;background-position:center;perspective:700px;color:#fff;font-family:inherit;box-shadow:var(--shadow);min-width:0}
.ccard::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 62%,color-mix(in srgb,var(--g) 55%,transparent),transparent 70%)}
.ccard .fig{position:absolute;inset:8% 6% 14%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.ccard .fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 18px 18px rgba(0,0,0,.55))}
.ccard .fig img+img{transform:rotateY(180deg)}
.ccard .tilt{position:absolute;inset:0;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out;transform-style:preserve-3d}
.ccard.back .fig{transform:rotateY(180deg)}
.ccard .nm{position:absolute;inset-inline:12px;bottom:12px;padding:8px 12px;border-radius:16px;background:rgba(10,10,30,.45);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font:700 17px var(--font-display);letter-spacing:.14em;text-align:center}
.chint{color:var(--muted);font-size:13px;margin-top:14px}
@media (max-width:860px){.typer{grid-template-columns:1fr}.chars{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){.caret{animation:none}.chip{animation:none}}
.ftw{padding-block:24px 40px}
.ft{padding:36px 32px 22px;display:flex;flex-direction:column;gap:28px}
.ftgrid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:28px}

.menu{position:fixed;z-index:52;top:0;bottom:0;right:0;left:auto;width:min(320px,86vw);padding:calc(env(safe-area-inset-top,0px) + 84px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);border-radius:28px 0 0 28px;background:var(--bg);will-change:transform;contain:layout paint;border-inline:0;border-left:1px solid var(--glass-line);box-shadow:-24px 0 60px -20px rgba(10,10,40,.45);display:flex;flex-direction:column;gap:2px;overflow-y:auto;visibility:hidden;transform:translateX(108%);transition:transform .26s cubic-bezier(.4,0,1,1),visibility 0s .26s}

/* live sentence demo: a real input over a colour-coded mirror */

.tin{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;outline:0;background:none;resize:none;overflow:hidden;

  function tx(k,r){var s=D()[k];if(s==null)s=T.fa[k]||'';if(r)for(var p in r)s=s.replace('{'+p+'}',r[p]);return s}
  function ls(k){try{var a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}}
  function lss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  function lsv(k){try{return localStorage.getItem(k)||''}catch(e){return''}}
  function fm(m,s,ok){m.textContent=s;m.className='fmsg '+(ok?'ok':'err')}
  function gate(){return !!adm||Date.now()-(+lsv('ario.cmts')||0)>15000}
  function stamp(){try{localStorage.setItem('ario.cmts',String(Date.now()))}catch(e){}}

  /* ---- storage: Firebase REST, or localStorage in demo mode ---- */
  function req(m,p,b,au,q){
    var u=db+p+'.json',qs=[];if(q)qs.push(q);if(au&&adm)qs.push('auth='+encodeURIComponent(adm));if(qs.length)u+='?'+qs.join('&');
    var o={method:m};if(b){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(b)}
    return fetch(u,o).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()});
  }
  function uid(){return 'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function arr(o){return o?Object.keys(o).map(function(k){var x=o[k]||{};x.id=k;return x}):[]}
  function byTs(a,b){return (a.ts||0)-(b.ts||0)}
  function loadC(){
    if(local){C=ls('ario.cm').sort(byTs);return Promise.resolve()}
    return req('GET','/comments',null,false,'orderBy=%22%24key%22&limitToLast=400').then(function(o){C=arr(o).sort(byTs)});
  }
  function loadT(){
    if(!adm)return Promise.resolve();
    if(local){TK=ls('ario.tk').sort(byTs);return Promise.resolve()}
    return req('GET','/tickets',null,true).then(function(o){TK=arr(o).sort(byTs)});
  }
  function add(kind,o){
    if(local){o.id=uid();o.ts=Date.now();var k=kind==='c'?'ario.cm':'ario.tk',a=ls(k);a.push(o);lss(k,a);return Promise.resolve(o.id)}
    o.ts={'.sv':'timestamp'};
    return req('POST',kind==='c'?'/comments':'/tickets',o,!!o.o).then(function(r){return r&&r.name});
  }
  function remove(kind,id){
    if(local){var k=kind==='c'?'ario.cm':'ario.tk';lss(k,ls(k).filter(function(x){return x.id!==id&&x.p!==id}));return Promise.resolve()}
    if(kind==='t')return req('DELETE','/tickets/'+id,null,true);
    var m={};m['comments/'+id]=null;C.forEach(function(c){if(c.p===id)m['comments/'+c.id]=null});
    return req('PATCH','/',m,true);
  }

  /* ---- small ui helpers ---- */
  function ago(ts){
    var s=Math.round((Date.now()-(+ts||Date.now()))/1000),u,v;
    if(s<45)return tx('cm_now');
    var m=Math.round(s/60);
    if(m<60){u='minute';v=m}else{var h=Math.round(m/60);
      if(h<24){u='hour';v=h}else{var d=Math.round(h/24);
        if(d<30){u='day';v=d}else{var mo=Math.round(d/30);if(mo<12){u='month';v=mo}else{u='year';v=Math.round(d/365)}}}}
    try{return new Intl.RelativeTimeFormat(D().lang,{numeric:'auto'}).format(-v,u)}catch(e){return ''}
  }
  function avatar(n,own,sm){
    var a=el('span','av'+(sm?' sm':''));
    if(own){var im=document.createElement('img');im.src='assets/icon.webp';im.alt='';a.appendChild(im);return a}
    var h=0,i;for(i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;
    a.style.background='linear-gradient(135deg,hsl('+h+' 70% 52%),hsl('+((h+55)%360)+' 72% 46%))';
    a.textContent=(Array.from(n)[0]||'?').toUpperCase();return a;
  }
  function stars(n){
    var s=el('span','stars'),h='',i;s.setAttribute('role','img');s.setAttribute('aria-label',tx('cm_star',{n:num(n,cur)}));
    for(i=1;i<=5;i++)h+='<span'+(i<=n?' class="on"':'')+'>'+STAR+'</span>';
    s.innerHTML=h;return s;
  }

  /* ---- reviews ---- */
  function renderSum(){
    var b=g('cmsum');b.textContent='';
    var P=C.filter(function(c){return !c.p}),R=P.filter(function(c){return c.r>0}),cnt=[0,0,0,0,0,0],s=0,i;
    R.forEach(function(c){var r=Math.min(5,Math.max(1,Math.round(c.r)));cnt[r]++;s+=r});
    var avg=R.length?s/R.length:0;
    var l=el('div','cm-sc');l.appendChild(el('b','cm-big',R.length?num(avg.toFixed(1),cur):'–'));l.appendChild(stars(Math.round(avg)));l.appendChild(el('span','note',tx('cm_cnt',{n:num(P.length,cur)})));
    var r=el('div','cm-bars');
    for(i=5;i>=1;i--){var row=el('div','br'),t=el('i'),f=el('b');row.appendChild(el('span','',num(i,cur)));f.style.width=(R.length?Math.round(cnt[i]/R.length*100):0)+'%';t.appendChild(f);row.appendChild(t);row.appendChild(el('span','',num(cnt[i],cur)));r.appendChild(row)}
    b.appendChild(l);b.appendChild(r);
  }
  function head(c,rep){
    var own=c.o===1,nm=own?tx('cm_team'):(c.n||tx('cm_anon')),h=el('div','cm-h'),w=el('div','cm-who'),r=el('div','cm-nm'),b=el('b','',nm);
    b.dir='auto';r.appendChild(b);if(own)r.appendChild(el('em','badge',tx('cm_official')));
    w.appendChild(r);w.appendChild(el('time','',ago(c.ts)));
    h.appendChild(avatar(nm,own,rep));h.appendChild(w);
    if(!rep&&c.r>0)h.appendChild(stars(c.r));
    return h;
  }
  function txt(c){var p=el('p','cm-t',c.t);p.dir='auto';return p}
  function acts(c,rep){
    var a=el('div','cm-a');
    if(!rep){var b=el('button','lk',tx('cm_reply'));b.type='button';b.onclick=function(){replyTo=(replyTo===c.id?null:c.id);renderList()};a.appendChild(b)}
    if(adm){var d=el('button','lk dl',tx('cm_del'));d.type='button';d.onclick=function(){
      if(!confirm(tx('cm_delq')))return;
      remove('c',c.id).then(loadC).then(renderAll).catch(function(){alert(tx('cm_e_net'))});
    };a.appendChild(d)}
    return a;
  }
  function rform(c){
    var f=el('form','cm-rf'),n=null,t=el('textarea','fld'),row=el('div','cm-act'),s=el('button','btn',tx('cm_rsend')),x=el('button','btn ghost',tx('cm_cancel')),m=el('span','fmsg');
    f.noValidate=true;
    if(!adm){n=el('input','fld');n.maxLength=40;n.placeholder=tx('cm_name');n.value=lsv('ario.name');f.appendChild(n)}
    t.rows=2;t.maxLength=600;t.placeholder=tx('cm_rtext');f.appendChild(t);
    s.type='submit';x.type='button';x.onclick=function(){replyTo=null;renderList()};m.setAttribute('role','status');m.setAttribute('aria-live','polite');
    row.appendChild(s);row.appendChild(x);row.appendChild(m);f.appendChild(row);
    f.onsubmit=function(e){
      e.preventDefault();var v=t.value.trim();
      if(v.length<3){fm(m,tx('cm_e_text'));return}
      if(!gate()){fm(m,tx('cm_e_wait'));return}
      var o={t:v.slice(0,600),p:c.id};
      if(adm)o.o=1;else{o.n=(n.value||'').trim().slice(0,40);try{localStorage.setItem('ario.name',o.n)}catch(_){}}
      s.disabled=true;
      add('c',o).then(function(){stamp();replyTo=null;return loadC()}).then(renderAll).catch(function(){s.disabled=false;fm(m,tx('cm_e_net'))});
    };
    return f;
  }
  function renderList(){
    var L=g('cmlist');L.textContent='';
    if(failed){var e=el('div','glass cm-empty'),rb=el('button','btn ghost',tx('cm_retry'));e.appendChild(el('span','',tx('cm_e_net')));rb.type='button';rb.onclick=function(){view('comments')};e.appendChild(rb);L.appendChild(e);return}
    if(!loaded){L.appendChild(el('p','glass cm-empty',tx('cm_load')));return}
    var P=C.filter(function(c){return !c.p}).sort(function(a,b){return byTs(b,a)}),R={};
    if(!P.length){L.appendChild(el('p','glass cm-empty',tx('cm_none')));return}
    C.forEach(function(c){if(c.p)(R[c.p]=R[c.p]||[]).push(c)});
    P.slice(0,shown).forEach(function(c){
      var it=el('article','glass cm-item'),rs=R[c.id];
      it.appendChild(head(c,false));it.appendChild(txt(c));it.appendChild(acts(c,false));
      if(rs&&rs.length){var w=el('div','cm-reps');rs.forEach(function(r){var x=el('div','cm-rep'+(r.o===1?' own':''));x.appendChild(head(r,true));x.appendChild(txt(r));if(adm)x.appendChild(acts(r,true));w.appendChild(x)});it.appendChild(w)}
      if(replyTo===c.id){var f=rform(c);it.appendChild(f);setTimeout(function(){var q=f.querySelector('textarea');if(q)q.focus()},0)}
      L.appendChild(it);
    });
    if(P.length>shown){var mb=el('button','btn ghost',tx('cm_more'));mb.type='button';mb.style.justifySelf='center';mb.onclick=function(){shown+=10;renderList()};L.appendChild(mb)}
  }
  function paintRate(){
    var w=g('cmrate');w.textContent='';
    for(var i=1;i<=5;i++)(function(i){
      var b=el('button',i<=rate?'on':'');b.type='button';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(rate===i));b.setAttribute('aria-label',tx('cm_star',{n:num(i,cur)}));b.innerHTML=STAR;
      b.onclick=function(){rate=(rate===i?0:i);paintRate()};w.appendChild(b);
    })(i);
  }
  function sendC(e){
    e.preventDefault();var f=g('cmform'),m=g('cmmsg'),b=g('cmsend');
    if(f.hp.value)return;
    var t=f.t.value.trim();
    if(t.length<3){fm(m,tx('cm_e_text'));return}
    if(!gate()){fm(m,tx('cm_e_wait'));return}
    var o={t:t.slice(0,600),n:f.n.value.trim().slice(0,40)};if(rate)o.r=rate;
    try{localStorage.setItem('ario.name',o.n)}catch(_){}
    b.disabled=true;
    add('c',o).then(function(){stamp();f.t.value='';rate=0;paintRate();b.disabled=false;fm(m,tx('cm_ok'),true);return loadC()}).then(function(){failed=false;loaded=true;renderAll()}).catch(function(){b.disabled=false;fm(m,tx('cm_e_net'))});
  }

  /* ---- support ---- */
  function renderSp(){
    var G=g('spgrid');G.textContent='';
    function link(v,base){return /^https?:/.test(v)?v:base+v.replace('@','')}
    var cs=[['faq',tx('sp_faq_t'),tx('sp_faq_d'),'#p-faq',0]];
    if(SOCIAL.telegram)cs.push(['tg','Telegram',tx('sp_tg_d'),link(SOCIAL.telegram,'https://t.me/'),1]);
    if(SOCIAL.instagram)cs.push(['ig','Instagram',tx('sp_ig_d'),link(SOCIAL.instagram,'https://instagram.com/'),1]);
    if(SOCIAL.email)cs.push(['em',SOCIAL.email,tx('sp_em_d'),'mailto:'+SOCIAL.email,0]);
    cs.forEach(function(c){
      var a=el('a','glass card sp-c'),ic=el('div','ic');ic.innerHTML=IC[c[0]];a.href=c[3];if(c[4]){a.target='_blank';a.rel='noopener'}
      a.appendChild(ic);a.appendChild(el('h3','',c[1]));a.appendChild(el('p','',c[2]));G.appendChild(a);
    });
  }
  function sendT(e){
    e.preventDefault();var f=g('spform'),m=g('spmsg'),b=g('spsend');
    if(f.hp.value)return;
    var c=f.c.value.trim(),t=f.m.value.trim();
    if(c.length<3){fm(m,tx('sp_e_c'));return}
    if(t.length<10){fm(m,tx('sp_e_m'));return}
    if(!gate()){fm(m,tx('cm_e_wait'));return}
    var o={n:f.n.value.trim().slice(0,40),c:c.slice(0,100),k:f.k.value,m:t.slice(0,1000)};
    b.disabled=true;
    add('t',o).then(function(id){
      stamp();f.m.value='';b.disabled=false;
      fm(m,tx('sp_ok',{id:String(id||Math.random().toString(36).slice(2)).slice(-6).toUpperCase()}),true);
      if(adm)return loadT().then(renderTk);
    }).catch(function(){b.disabled=false;fm(m,tx('cm_e_net'))});
  }
  function renderTk(){
    var box=g('sptk');box.hidden=!adm;if(!adm)return;
    var L=g('sptkl');L.textContent='';
    if(!TK.length){L.appendChild(el('p','note',tx('sp_tk0')));return}
    var K={b:'sp_k1',q:'sp_k2',s:'sp_k3',o:'sp_k4'};
    TK.slice().reverse().forEach(function(k){
      var it=el('div','glass tk'),h=el('div','tk-h'),nm=el('b','',k.n||tx('cm_anon')),p=el('p','',k.m),ct=el('span','ct',k.c);
      nm.dir='auto';p.dir='auto';ct.dir='auto';
      h.appendChild(el('em','badge',tx(K[k.k]||'sp_k4')));h.appendChild(nm);h.appendChild(el('time','',ago(k.ts)));
      var d=el('button','lk dl',tx('cm_del'));d.type='button';d.style.justifySelf='start';
      d.onclick=function(){if(!confirm(tx('cm_delq')))return;remove('t',k.id).then(loadT).then(renderTk).catch(function(){alert(tx('cm_e_net'))})};
      it.appendChild(h);it.appendChild(ct);it.appendChild(p);it.appendChild(d);L.appendChild(it);
    });
  }

  /* ---- admin (owner) ---- */
  function paintAdm(){document.querySelectorAll('.admbtn').forEach(function(b){b.textContent=tx(adm?'adm_out':'adm_in')})}
  function setAdm(k){
    adm=k||null;try{if(adm)localStorage.setItem('ario.adm',adm);else localStorage.removeItem('ario.adm')}catch(e){}
    if(!adm)TK=[];
    paintAdm();renderAll();
    if(adm)loadT().then(renderTk).catch(function(){});
  }
  function login(k){
    if(local)return Promise.resolve();
    var prev=adm;adm=k;
    return req('GET','/tickets',null,true,'shallow=true').then(function(){},function(e){adm=prev;throw e});
  }

  /* ---- wiring ---- */
  function renderAll(){
    renderSum();renderList();renderTk();
    var n=local?tx('cm_local'):(adm?tx('adm_on'):'');
    g('cmnote').textContent=n;g('spnote').textContent=n;
  }
  function render(){paintAdm();paintRate();renderSp();renderAll()}
  function view(v){
    if(v==='comments'){loadC().then(function(){failed=false;loaded=true;renderAll()},function(){failed=true;renderAll()})}
    if(v==='support'){renderSp();if(adm)loadT().then(renderTk).catch(function(){})}
  }
  g('cmform').addEventListener('submit',sendC);
  g('spform').addEventListener('submit',sendT);
  var nm0=lsv('ario.name');if(nm0)g('cmform').n.value=nm0;
  var dlg=g('adm');
  document.querySelectorAll('.admbtn').forEach(function(b){b.addEventListener('click',function(){
    if(adm){setAdm(null);return}
    g('admk').value='';g('admmsg').textContent='';if(dlg.showModal)dlg.showModal();g('admk').focus();
  })});
  g('admx').addEventListener('click',function(){dlg.close()});
  g('admf').addEventListener('submit',function(e){
    e.preventDefault();var k=g('admk').value.trim(),m=g('admmsg');if(!k)return;
    login(k).then(function(){dlg.close();setAdm(k)},function(){fm(m,tx('adm_bad'))});
  });
  render();
  return {render:render,view:view};
})();
CM.view(curView());
})();
</script>

</body></html>
